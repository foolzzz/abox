services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentbox
      POSTGRES_PASSWORD: agentbox
      POSTGRES_DB: agentbox
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbox -d agentbox"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - agentbox-postgres:/var/lib/postgresql/data

volumes:
  agentbox-postgres:
